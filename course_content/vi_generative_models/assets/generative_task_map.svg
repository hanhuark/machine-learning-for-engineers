<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Task map for reconstruction, generation, and inverse design</title>
  <desc id="desc">Three conceptual panels distinguish reconstructing a measured input, sampling a synthetic output, and proposing a design constrained by target performance.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .heading { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 17px Arial, sans-serif; fill: #0f172a; }
      .small { font: 15px Arial, sans-serif; fill: #334155; }
      .note { font: italic 14px Arial, sans-serif; fill: #475569; }
      .box { stroke: #475569; stroke-width: 2; rx: 12; }
      .flow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="430" fill="#ffffff"/>
  <text x="48" y="48" class="heading">Three different tasks require different evidence</text>
  <text x="48" y="75" class="small">Conceptual diagram — arrows indicate information flow, not physical transport; not to scale.</text>

  <g transform="translate(48,110)">
    <rect width="340" height="260" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="24" y="38" class="label">1. Reconstruction</text>
    <rect x="24" y="76" width="82" height="60" class="box" fill="#dbeafe"/><text x="42" y="102" class="small">Measured</text><text x="50" y="121" class="small">input x</text>
    <rect x="130" y="76" width="82" height="60" class="box" fill="#bfdbfe"/><text x="149" y="102" class="small">Latent</text><text x="159" y="121" class="small">z</text>
    <rect x="236" y="76" width="82" height="60" class="box" fill="#dbeafe"/><text x="249" y="102" class="small">Rebuilt</text><text x="252" y="121" class="small">x-hat</text>
    <path d="M106 106 H130" class="flow"/><path d="M212 106 H236" class="flow"/>
    <text x="24" y="180" class="small">Question: what was lost, compressed,</text><text x="24" y="202" class="small">or denoised from an observed input?</text>
    <text x="24" y="235" class="note">Check: held-out reconstruction error</text>
  </g>

  <g transform="translate(430,110)">
    <rect width="340" height="260" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="24" y="38" class="label">2. Generation</text>
    <rect x="24" y="76" width="82" height="60" class="box" fill="#ede9fe"/><text x="44" y="102" class="small">Latent</text><text x="50" y="121" class="small">z, c</text>
    <rect x="130" y="76" width="82" height="60" class="box" fill="#ddd6fe"/><text x="145" y="112" class="small">Generator</text>
    <rect x="236" y="76" width="82" height="60" class="box" fill="#ede9fe"/><text x="250" y="102" class="small">Synthetic</text><text x="255" y="121" class="small">sample</text>
    <path d="M106 106 H130" class="flow"/><path d="M212 106 H236" class="flow"/>
    <text x="24" y="180" class="small">Question: can the model sample a useful</text><text x="24" y="202" class="small">distribution under stated conditions?</text>
    <text x="24" y="235" class="note">Check: diversity, memorization, task utility</text>
  </g>

  <g transform="translate(812,110)">
    <rect width="340" height="260" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="24" y="38" class="label">3. Inverse design</text>
    <rect x="24" y="76" width="82" height="60" class="box" fill="#d1fae5"/><text x="38" y="102" class="small">Target</text><text x="36" y="121" class="small">performance</text>
    <rect x="130" y="76" width="82" height="60" class="box" fill="#a7f3d0"/><text x="146" y="102" class="small">Design</text><text x="144" y="121" class="small">proposal</text>
    <rect x="236" y="76" width="82" height="60" class="box" fill="#d1fae5"/><text x="248" y="102" class="small">Feasible</text><text x="252" y="121" class="small">candidate</text>
    <path d="M106 106 H130" class="flow"/><path d="M212 106 H236" class="flow"/>
    <text x="24" y="180" class="small">Question: which input/design meets a</text><text x="24" y="202" class="small">target while satisfying constraints?</text>
    <text x="24" y="235" class="note">Check: objective, units, constraints, validation</text>
  </g>
</svg>
