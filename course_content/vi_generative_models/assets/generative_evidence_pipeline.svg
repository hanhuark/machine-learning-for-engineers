<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Evidence and constraint pathway for generated engineering content</title>
  <desc id="desc">A conceptual workflow showing that a generated output moves through provenance, independent evaluation, and physical or design constraint checks before a bounded engineering claim.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .heading { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .body { font: 15px Arial, sans-serif; fill: #334155; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .flow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="48" y="48" class="heading">A generated output is not yet an engineering claim</text>
  <text x="48" y="75" class="small">Conceptual quality gate — all boxes are required for the stated evidence level; not to scale.</text>

  <g transform="translate(48,135)">
    <rect width="190" height="150" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="25" y="38" class="label">Source data</text>
    <text x="25" y="70" class="body">Measured or simulated</text><text x="25" y="92" class="body">with provenance, units,</text><text x="25" y="114" class="body">and split boundary</text>
  </g>
  <path d="M238 210 H295" class="flow"/>
  <g transform="translate(295,135)">
    <rect width="190" height="150" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="25" y="38" class="label">Model output</text>
    <text x="25" y="70" class="body">Reconstruction,</text><text x="25" y="92" class="body">synthetic sample, or</text><text x="25" y="114" class="body">design proposal</text>
  </g>
  <path d="M485 210 H542" class="flow"/>
  <g transform="translate(542,135)">
    <rect width="190" height="150" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="25" y="38" class="label">Independent checks</text>
    <text x="25" y="70" class="body">Held-out metric,</text><text x="25" y="92" class="body">diversity, leakage,</text><text x="25" y="114" class="body">and task comparison</text>
  </g>
  <path d="M732 210 H789" class="flow"/>
  <g transform="translate(789,135)">
    <rect width="190" height="150" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="25" y="38" class="label">Physical/design screen</text>
    <text x="25" y="70" class="body">Conservation, bounds,</text><text x="25" y="92" class="body">manufacturability,</text><text x="25" y="114" class="body">and safety constraints</text>
  </g>
  <path d="M979 210 H1036" class="flow"/>
  <g transform="translate(1036,135)">
    <rect width="116" height="150" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="21" y="38" class="label">Bounded</text><text x="24" y="59" class="label">claim</text>
    <text x="21" y="95" class="body">State what</text><text x="21" y="116" class="body">is and is not</text><text x="21" y="137" class="body">supported</text>
  </g>
  <text x="48" y="344" class="small">Failure examples: memorization • mode collapse • artifact amplification • constraint violation • out-of-distribution target • synthetic/measurement confusion</text>
</svg>
